# Agrégateur Sport Antenne : construit le flux toutes les heures et le publie sur la branche « feed ».
# L'appli télécharge ensuite un seul fichier léger : https://raw.githubusercontent.com/aml32/huntstat/feed/feed.json.gz
#
# NB : une tâche planifiée (schedule) ne se déclenche que depuis la branche par défaut du dépôt.
# Elle ne tournera donc qu'une fois ce fichier fusionné dans la branche principale.
name: Flux Sport Antenne

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la minute 17
  workflow_dispatch: {}     # bouton « Run workflow » pour un lancement manuel

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Construire le flux
        working-directory: sport-antenne/server
        run: ./gradlew --no-daemon run --args="$GITHUB_WORKSPACE/out"
      - name: Publier sur la branche feed
        env:
          GIT_AUTHOR_NAME: sport-antenne-bot
          GIT_AUTHOR_EMAIL: noreply@anthropic.com
          GIT_COMMITTER_NAME: sport-antenne-bot
          GIT_COMMITTER_EMAIL: noreply@anthropic.com
        run: |
          cd "$GITHUB_WORKSPACE"
          test -s out/feed.json.gz
          git switch --orphan feed
          cp out/feed.json out/feed.json.gz out/build-log.txt .
          git add feed.json feed.json.gz build-log.txt
          git commit -m "Flux $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin feed
